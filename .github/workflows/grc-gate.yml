# grc-gate: run the policy gate on every pull request.
# This is a skeleton. The steps marked TODO are yours to write. The brief on
# Patreon explains what each one does and why.
name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.69.0
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin
          conftest --version
      - name: Run policy gate
        run: |
          set -o pipefail
          mkdir -p evidence
          conftest test week-3/evidence/plan.json \
            --policy week-2/policies \
            --namespace compliance.sc28_aws \
            --namespace compliance.ac3_aws \
            --namespace compliance.cm6_aws \
            --output json | tee evidence/conftest-results.json || echo "GATE_FAILED=true" >> "$GITHUB_ENV"
      - name: Bundle evidence and hash it
        if: always()
        run: |
          tar czf evidence-bundle.tar.gz evidence/
          sha256sum evidence-bundle.tar.gz > evidence-bundle.tar.gz.sha256
          cat evidence-bundle.tar.gz.sha256
      - name: Sign evidence bundle
        if: always()
        uses: sigstore/cosign-installer@v3
      - name: Cosign sign
        if: always()
        run: |
          cosign sign-blob --yes \
            --bundle evidence-bundle.tar.gz.sig.bundle \
            evidence-bundle.tar.gz
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-gate-evidence
          path: |
            evidence/
            evidence-bundle.tar.gz
            evidence-bundle.tar.gz.sha256
            evidence-bundle.tar.gz.sig.bundle
      - name: Fail if the gate failed
        if: always()
        run: |
          if [ "${GATE_FAILED:-false}" = "true" ]; then
            echo "Policy violations detected. See evidence/conftest-results.json."
            exit 1
          fi
          echo "All policies passed."

      # STRETCH: instead of a committed plan.json, assume an AWS role via OIDC
      #          (no stored keys) and generate the plan in CI. See the brief.
